packages:
  - 'packages/*'
allowBuilds:
  '@parcel/watcher': true
  core-js: true
  esbuild: true
  nx: true
  protobufjs: true
  unrs-resolver: true
  vue-demi: true
overrides:
  # data-model is a locally maintained fork (realdwg-web, adds the dwgHandle
  # field used by Route-B DWG patch-save); it is NOT published to npm. The
  # committed dependency is the vendored tarball snapshot below. To refresh:
  # rebuild the fork, re-pack, replace vendor/*.tgz and bump this entry.
  # For local fork iteration you may temporarily switch this line to a path
  # override ('../../../realdwg-web/packages/data-model', resolved from each
  # importer dir) — do not commit that machine-specific form or its lockfile.
  # NOTE: this override is intentionally workspace-wide: data-model is a shared
  # peer of every @mlightcad package and a second copy would split the single
  # workingDatabase / instanceof identity. Keep it until upstream absorbs dwgHandle.
  '@mlightcad/data-model': 'file:./vendor/njbestway-data-model-1.16.5.tgz'
  # acad-rust-converter is back in the workspace (packages/acad-rust-converter)
  # and marked private: it is never published from this repo (npm 0.1.0 from the
  # archived standalone repo stays the published line). The CLI declares 0.1.0
  # so its published artifact resolves on npm; this workspace override keeps
  # every local consumer (incl. the CLI) linked to the in-tree 0.2.0 sources.
  '@njbestway/acad-rust-converter': 'workspace:*'
  '@mlightcad/libredwg-converter': '3.16.5'
  '@mlightcad/mtext-input-box': '0.3.10'
  '@mlightcad/mtext-parser': '1.5.7'
  '@mlightcad/mtext-renderer': '0.13.10'
  '@mlightcad/ribbon': '0.1.18'
  '@mlightcad/ui-components': '0.1.14'
  '@types/three': '^0.186.0'
  element-plus: '^2.13.4'
  glob: '^13.0.6'
  jsdom: '^30.1.3'
  lodash-es: '4.17.21'
  three: '^0.186.1'
  vue: '^3.4.21'
  vue-i18n: '^11.4.4'
