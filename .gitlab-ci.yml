stages:
  - ci
  - deploy
  - pages

variables:
  NODE_VERSION: "20"
  PNPM_VERSION: "10.33.4"
  # Keep the Rust toolchain inside the project dir so it can be cached between
  # pipelines. @mlightcad/acad-rust-converter compiles a wasm32 crate during
  # `pnpm build` (see packages/acad-rust-converter/scripts/build-wasm.mjs),
  # which needs `cargo`, the `wasm32-unknown-unknown` target, and a pinned
  # `wasm-bindgen` CLI (0.2.126 — must match the crate dependency exactly).
  CARGO_HOME: "${CI_PROJECT_DIR}/.cargo"
  RUSTUP_HOME: "${CI_PROJECT_DIR}/.rustup"
  WASM_BINDGEN_VERSION: "0.2.126"

# Shared setup for every job that runs `pnpm build`: install pnpm, provision the
# Rust/wasm toolchain (cached), then install JS dependencies.
.build-setup:
  cache:
    key: "build-${CI_COMMIT_REF_SLUG}"
    paths:
      - node_modules/
      - .pnpm-store/
      - .cargo/
      - .rustup/
  before_script:
    - npm install -g pnpm@${PNPM_VERSION}
    - export PATH="${CARGO_HOME}/bin:${PATH}"
    - |
      if ! command -v cargo >/dev/null 2>&1; then
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
          | sh -s -- -y --profile minimal --default-toolchain stable
      fi
    - rustup target add wasm32-unknown-unknown
    - |
      if ! command -v wasm-bindgen >/dev/null 2>&1; then
        cargo install wasm-bindgen-cli --version ${WASM_BINDGEN_VERSION} --locked
      fi
    - pnpm install --frozen-lockfile

# ----------------------
# CI Job
# ----------------------
ci:
  stage: ci
  extends: .build-setup
  image: node:20
  script:
    - pnpm lint
    - pnpm build
    - pnpm test
  rules:
    # Run on pushes to main
    - if: '$CI_COMMIT_BRANCH == "main"'
    # Run on merge requests
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ----------------------
# Deploy Job
# ----------------------
deploy:
  stage: deploy
  extends: .build-setup
  image: node:20
  dependencies:
    - ci
  script:
    - pnpm build
    - pnpm docs:build
    - pnpm pre-serve
    - mkdir -p public
    - cp -r ./packages/examples/public/* public/
  artifacts:
    paths:
      - public
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# ----------------------
# GitLab Pages Deployment
# ----------------------
pages:
  stage: pages
  variables:
    GIT_STRATEGY: none
  script:
    - echo "Deploying to GitLab Pages..."
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
