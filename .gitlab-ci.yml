stages:
  - ci
  - deploy
  - pages

variables:
  NODE_VERSION: "20"
  PNPM_VERSION: "10.33.4"

# Shared setup for every job that runs `pnpm build`: install pnpm, then install
# JS dependencies.
.build-setup:
  cache:
    key: "build-${CI_COMMIT_REF_SLUG}"
    paths:
      - node_modules/
      - .pnpm-store/
  before_script:
    - npm install -g pnpm@${PNPM_VERSION}
    - pnpm install --frozen-lockfile

# ----------------------
# CI Job
# ----------------------
ci:
  stage: ci
  extends: .build-setup
  image: node:20
  script:
    - pnpm lint
    - pnpm build
    - pnpm test
  rules:
    # Run on pushes to main
    - if: '$CI_COMMIT_BRANCH == "main"'
    # Run on merge requests
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ----------------------
# Deploy Job
# ----------------------
deploy:
  stage: deploy
  extends: .build-setup
  image: node:20
  dependencies:
    - ci
  script:
    - pnpm build
    - pnpm docs:build
    - pnpm pre-serve
    - mkdir -p public
    - cp -r ./packages/examples/public/* public/
  artifacts:
    paths:
      - public
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# ----------------------
# GitLab Pages Deployment
# ----------------------
pages:
  stage: pages
  variables:
    GIT_STRATEGY: none
  script:
    - echo "Deploying to GitLab Pages..."
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
