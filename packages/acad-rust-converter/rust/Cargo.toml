[package]
name = "acad-rust-converter"
version = "0.1.0"
edition = "2021"
publish = false
description = "WASM bridge exposing acadrust DWG parsing to the @mlightcad/acad-rust-converter npm package"
license = "MPL-2.0"

# This crate is compiled to wasm32-unknown-unknown and consumed by the
# TypeScript worker in ../src. It is never published to crates.io; the built
# `wasm/pkg` glue is bundled into the npm package instead.
[lib]
name = "acad_rust_converter"
crate-type = ["cdylib", "rlib"]

# Offline native-only fixture generator (see src/bin/dump_fixture.rs). Gated
# behind a non-default feature so `cargo build --target
# wasm32-unknown-unknown` (used by scripts/build-wasm.mjs) never tries to
# compile it - it relies on `std::fs` and `DwgReader::from_file`, neither of
# which exist on the wasm32-unknown-unknown target.
[[bin]]
name = "dump_fixture"
path = "src/bin/dump_fixture.rs"
required-features = ["dumper"]

[features]
dumper = ["dep:anyhow"]

[dependencies]
# Locked to the version validated in the Phase 0 spike (Gate 0). acadrust is
# MPL-2.0 (file-level copyleft) and compiles cleanly for wasm32 because its
# memmap2/rayon dependencies are gated behind cfg(not(target_arch = "wasm32")).
#
# Pinned to =0.6.4, NOT the latest 0.6.5: 0.6.5 regressed the DWG section
# reader and aborts valid drawings (e.g. samples/高山.dwg) with "Invalid DWG
# array count <n>: <m> record bits remain" at the pre-existing checked_count
# guard (merged_reader.rs) because a new miscount desyncs the bit reader at a
# type_code=37 record. 0.6.3/0.6.4 both decode it fully (244,756 entities);
# 0.6.4 is the newest known-good and keeps the Phase 4 entity coverage.
# Do not bump to 0.6.5 until upstream fixes that reader desync.
acadrust = { version = "=0.6.4", features = ["serde"] }
# Needed directly (not just transitively via `acadrust`'s `serde` feature) to
# name the `serde::Serialize` trait bound in `to_json`'s generic signature;
# `derive` lets the batched-block reply serialize a plain struct instead of an
# intermediate `serde_json::Value` tree.
serde = { version = "1", features = ["derive"] }
# Pinned exactly so the generated JS glue schema matches the installed
# `wasm-bindgen` CLI (0.2.126). A mismatch aborts wasm-bindgen with a schema
# version error.
wasm-bindgen = "=0.2.126"
serde_json = "1"
# Only used by the `dumper`-feature binary (ergonomic error chaining for its
# many `fs`/`serde_json` calls); optional so it never links into the wasm.
anyhow = { version = "1", optional = true }

[profile.release]
# Optimise for runtime speed rather than byte size: the DWG read dominates wall
# clock on large drawings (~4.7 s of a 9.4 s Architecture-B read, ~8 s of an
# Architecture-A transcode) and the browser fetches this wasm once per worker.
# `"s"` was picked before any end-to-end measurement; this is the A/B against
# the artifact size (roughly +20-30%, gzip absorbs most of it).
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
