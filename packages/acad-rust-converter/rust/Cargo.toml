[package]
name = "acad-rust-converter"
version = "0.1.0"
edition = "2021"
publish = false
description = "WASM bridge exposing acadrust DWG parsing to the @mlightcad/acad-rust-converter npm package"
license = "MPL-2.0"

# This crate is compiled to wasm32-unknown-unknown and consumed by the
# TypeScript worker in ../src. It is never published to crates.io; the built
# `wasm/pkg` glue is bundled into the npm package instead.
[lib]
name = "acad_rust_converter"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Locked to the version validated in the Phase 0 spike (Gate 0). acadrust is
# MPL-2.0 (file-level copyleft) and compiles cleanly for wasm32 because its
# memmap2/rayon dependencies are gated behind cfg(not(target_arch = "wasm32")).
acadrust = { version = "0.6.3", features = ["serde"] }
# Pinned exactly so the generated JS glue schema matches the installed
# `wasm-bindgen` CLI (0.2.126). A mismatch aborts wasm-bindgen with a schema
# version error.
wasm-bindgen = "=0.2.126"
serde_json = "1"

[profile.release]
# Optimise for byte size: the wasm is shipped to browsers.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
